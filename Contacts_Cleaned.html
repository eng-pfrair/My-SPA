        let exists = Accounts.some(acc => acc.name === accountName);
        if (exists) {
            visible(txt);
            txt.textContent = 'Account already exists';
            setTimeout(function () {
                invisible(txt);
            }, 2000);
            return;
        }
        
        // Add new account
        let accountData = {name: accountName, active: false};
        Accounts.push(accountData);
        
        saveBtn.textContent = "Saved!";
        saveData();
        setTimeout(function () {
            saveBtn.textContent = "Save";
            invisible(accountModal);
            accountModal.style.display = 'none';
            displayData(); // Re-render the list
            activeTheme();
            accountInput.value = '';
            invisible(txt);
        }, 1000);
    });
    
    // Cancel button
    cancelBtn.addEventListener("click", function () {
        invisible(accountModal);
        accountModal.style.display = 'none';
        accountInput.value = '';
        invisible(txt);
    });
    
    // Back button
    backBtn.addEventListener("click", function () {
        dump = [];
        viewHome();
        screenSwitch();
    });
    
    // Close modal when clicking outside
    window.onclick = function (event) {
        if (event.target === accountModal) {
            accountModal.style.display = 'none';
            invisible(accountModal);
        }
    };

    // Initial display
    displayData();
    activeTheme();
    updateAccountText();
}
